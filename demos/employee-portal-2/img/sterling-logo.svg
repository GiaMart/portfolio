<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Sterling Securities">
  <defs>
    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="diamondLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="diamondRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="diamondBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- Diamond -->
  <polygon points="160,8 214,38 160,68 106,38" fill="url(#diamondTop)"/>
  <polygon points="106,38 160,68 160,98 106,68" fill="url(#diamondLeft)"/>
  <polygon points="160,68 214,38 214,68 160,98" fill="url(#diamondRight)"/>
  <polygon points="106,68 160,98 214,68 160,68" fill="url(#diamondBottom)"/>
  <polygon points="160,8 106,38 160,68 214,38" fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="0.6"/>

  <!-- Accent lines -->
  <line x1="72" y1="78" x2="118" y2="78" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="202" y1="78" x2="248" y2="78" stroke="#1e3a5f" stroke-width="1.2"/>

  <!-- Wordmark -->
  <text x="160" y="104"
        text-anchor="middle"
        font-family="'Libre Baskerville', 'Times New Roman', serif"
        font-size="13.5"
        font-weight="700"
        letter-spacing="3.2"
        fill="#1e3a5f">STERLING SECURITIES</text>
</svg>
