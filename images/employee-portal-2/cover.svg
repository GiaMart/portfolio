<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Employee Portal 2.0">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="diamondLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="diamondRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="diamondBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1628" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#eef2f7"/>

  <!-- Header -->
  <rect width="1200" height="88" fill="url(#headerGrad)"/>
  <g transform="translate(72,22)">
    <polygon points="30,2 47,14 30,26 13,14" fill="url(#diamondTop)"/>
    <polygon points="13,14 30,26 30,42 13,30" fill="url(#diamondLeft)"/>
    <polygon points="30,26 47,14 47,30 30,42" fill="url(#diamondRight)"/>
    <polygon points="13,30 30,42 47,30 30,26" fill="url(#diamondBottom)"/>
  </g>
  <text x="130" y="52" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600">Employee Portal</text>
  <rect x="900" y="28" rx="18" ry="18" width="72" height="36" fill="rgba(56,189,248,0.18)"/>
  <rect x="990" y="28" rx="18" ry="18" width="72" height="36" fill="transparent"/>
  <rect x="1080" y="28" rx="18" ry="18" width="48" height="36" fill="transparent"/>
  <text x="918" y="51" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Home</text>
  <text x="1004" y="51" fill="rgba(255,255,255,0.82)" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Forms</text>
  <text x="1090" y="51" fill="rgba(255,255,255,0.82)" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">FAQs</text>

  <!-- Hero -->
  <rect x="72" y="118" width="1056" height="170" rx="20" fill="url(#heroGrad)" stroke="rgba(30,58,95,0.12)" filter="url(#cardShadow)"/>
  <text x="600" y="175" fill="#0a1628" font-family="Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">Welcome to the Sterling Employee Portal</text>
  <text x="600" y="212" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">Pay calendar, quick answers, and request forms – all in one place.</text>

  <!-- Quick links row -->
  <g transform="translate(92,240)">
    <rect x="0" y="0" width="320" height="34" rx="10" fill="#fff" stroke="rgba(148,163,184,0.28)"/>
    <rect x="340" y="0" width="320" height="34" rx="10" fill="#fff" stroke="rgba(148,163,184,0.28)"/>
    <rect x="680" y="0" width="320" height="34" rx="10" fill="#fff" stroke="rgba(148,163,184,0.28)"/>
    <circle cx="18" cy="17" r="10" fill="rgba(56,189,248,0.16)" stroke="rgba(56,189,248,0.22)"/>
    <circle cx="358" cy="17" r="10" fill="rgba(56,189,248,0.16)" stroke="rgba(56,189,248,0.22)"/>
    <circle cx="698" cy="17" r="10" fill="rgba(56,189,248,0.16)" stroke="rgba(56,189,248,0.22)"/>
    <text x="38" y="22" fill="#0a1628" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Supervisor Hotline</text>
    <text x="378" y="22" fill="#0a1628" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Request Forms</text>
    <text x="718" y="22" fill="#0a1628" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">FAQs</text>
  </g>

  <!-- Calendar card -->
  <rect x="72" y="318" width="620" height="360" rx="16" fill="#fff" stroke="rgba(30,58,95,0.12)" filter="url(#cardShadow)"/>
  <text x="96" y="358" fill="#0a1628" font-family="Georgia, serif" font-size="22" font-weight="700">Pay Schedule Calendar</text>
  <text x="96" y="386" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="14">July 2026</text>

  <!-- Mini calendar grid -->
  <g transform="translate(96,404)">
    <rect width="572" height="28" fill="#f1f5f9"/>
    <text x="20" y="19" fill="#64748b" font-size="11" font-weight="700">SUN</text>
    <text x="102" y="19" fill="#64748b" font-size="11" font-weight="700">MON</text>
    <text x="184" y="19" fill="#64748b" font-size="11" font-weight="700">TUE</text>
    <text x="266" y="19" fill="#64748b" font-size="11" font-weight="700">WED</text>
    <text x="348" y="19" fill="#64748b" font-size="11" font-weight="700">THU</text>
    <text x="430" y="19" fill="#64748b" font-size="11" font-weight="700">FRI</text>
    <text x="512" y="19" fill="#64748b" font-size="11" font-weight="700">SAT</text>
    <!-- row 1 -->
    <rect y="28" width="81.7" height="52" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="81.7" y="28" width="81.7" height="52" fill="#fff" stroke="#e2e8f0"/>
    <rect x="163.4" y="28" width="81.7" height="52" fill="#fff" stroke="#e2e8f0"/>
    <rect x="245.1" y="28" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="326.8" y="28" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="408.5" y="28" width="81.7" height="52" fill="rgba(34,197,94,0.16)" stroke="#e2e8f0"/>
    <rect x="490.2" y="28" width="81.8" height="52" fill="rgba(59,130,246,0.12)" stroke="#e2e8f0"/>
    <!-- row 2 -->
    <rect y="80" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="81.7" y="80" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="163.4" y="80" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="245.1" y="80" width="81.7" height="52" fill="rgba(56,189,248,0.08)" stroke="#e2e8f0"/>
    <rect x="326.8" y="80" width="81.7" height="52" fill="rgba(245,158,11,0.14)" stroke="#e2e8f0"/>
    <rect x="408.5" y="80" width="81.7" height="52" fill="#fff" stroke="#e2e8f0"/>
    <rect x="490.2" y="80" width="81.8" height="52" fill="#fff" stroke="#e2e8f0"/>
    <!-- today marker -->
    <circle cx="286" cy="106" r="14" fill="#0a1628"/>
    <text x="286" y="111" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">30</text>
    <text x="430" y="58" fill="#15803d" font-size="9" font-weight="700">PAY</text>
    <text x="512" y="58" fill="#1d4ed8" font-size="9" font-weight="700">START</text>
    <text x="350" y="112" fill="#b45309" font-size="9" font-weight="700">END</text>
  </g>

  <!-- Legend -->
  <g transform="translate(96,620)">
    <rect width="14" height="14" rx="2" fill="rgba(56,189,248,0.35)"/>
    <text x="22" y="12" fill="#64748b" font-size="12">Pay period</text>
    <rect x="120" width="14" height="14" rx="2" fill="rgba(59,130,246,0.45)"/>
    <text x="142" y="12" fill="#64748b" font-size="12">Start</text>
    <rect x="210" width="14" height="14" rx="2" fill="rgba(245,158,11,0.45)"/>
    <text x="232" y="12" fill="#64748b" font-size="12">End</text>
    <rect x="280" width="14" height="14" rx="2" fill="rgba(34,197,94,0.45)"/>
    <text x="302" y="12" fill="#64748b" font-size="12">Payday</text>
  </g>

  <!-- Sidebar cards -->
  <rect x="716" y="318" width="412" height="170" rx="16" fill="#fff" stroke="rgba(30,58,95,0.12)" filter="url(#cardShadow)"/>
  <text x="740" y="358" fill="#0a1628" font-family="Georgia, serif" font-size="20" font-weight="700">Need to Request Something?</text>
  <text x="740" y="388" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="14">• Uniform Request</text>
  <text x="740" y="412" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="14">• ID Card Request</text>
  <text x="740" y="436" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="14">• Contact Update</text>
  <rect x="740" y="450" width="120" height="28" rx="6" fill="#0a1628"/>
  <text x="760" y="469" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Go to forms</text>

  <rect x="716" y="508" width="412" height="170" rx="16" fill="#fff" stroke="rgba(30,58,95,0.12)" filter="url(#cardShadow)"/>
  <text x="740" y="548" fill="#0a1628" font-family="Georgia, serif" font-size="20" font-weight="700">Upcoming Pay Dates</text>
  <rect x="740" y="566" width="364" height="28" rx="4" fill="rgba(56,189,248,0.12)"/>
  <text x="752" y="585" fill="#0a1628" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Jul 12 – Jul 25, 2026</text>
  <text x="980" y="585" fill="#0a1628" font-family="Segoe UI, sans-serif" font-size="13">Fri, Aug 1</text>
  <rect x="1040" y="572" width="52" height="18" rx="9" fill="#dbeafe"/>
  <text x="1048" y="585" fill="#1d4ed8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">Current</text>
  <text x="752" y="620" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="13">Jul 26 – Aug 8, 2026</text>
  <text x="980" y="620" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="13">Fri, Aug 15</text>
  <rect x="1040" y="607" width="52" height="18" rx="9" fill="#0d6efd"/>
  <text x="1046" y="620" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">Next</text>

  <!-- Footer bar -->
  <rect y="702" width="1200" height="48" fill="#0a1628"/>
  <text x="600" y="732" fill="rgba(255,255,255,0.7)" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">Sterling Securities LLC · Verona, NJ</text>
</svg>
